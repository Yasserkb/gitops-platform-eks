server:
  port: 8080

app:
  environment: ${APP_ENVIRONMENT:local}
  version: ${APP_VERSION:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: demo-api
