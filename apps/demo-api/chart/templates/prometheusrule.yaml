{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    release: kube-prometheus-stack
    {{- include "demo-api.labels" . | nindent 4 }}
spec:
  groups:
    - name: demo-api.rules
      rules:
        - alert: DemoApiDown
          expr: up{job=~".*demo-api.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Demo API is down
            description: Prometheus cannot scrape the demo-api service.
{{- end }}
