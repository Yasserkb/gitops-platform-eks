name: demo-api-ci

on:
  pull_request:
    paths:
      - "apps/demo-api/**"
      - ".github/workflows/ci-demo-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/demo-api/**"
      - ".github/workflows/ci-demo-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: mvn -B test

      - name: Build container image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/demo-api:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/demo-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: apps/demo-api/trivy-results.sarif

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository_owner }}/demo-api:${{ github.sha }}

  helm-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint apps/demo-api/chart -f environments/dev/demo-api/values.yaml
      - name: Helm template
        run: helm template demo-api apps/demo-api/chart -f environments/dev/demo-api/values.yaml > rendered.yaml

