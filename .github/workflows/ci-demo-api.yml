name: demo-api-ci

on:
  pull_request:
    paths:
      - "apps/demo-api/**"
      - ".github/workflows/ci-demo-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/demo-api/**"
      - ".github/workflows/ci-demo-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write
  security-events: write

jobs:
  test-build-scan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/demo-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: apps/demo-api/pom.xml

      - name: Run unit tests
        run: mvn -B test

      - name: Prepare image metadata
        run: |
          IMAGE_REPOSITORY=$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/demo-api" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE="${IMAGE_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "Using image: ${IMAGE}"

      - name: Build container image
        run: docker build -t "${IMAGE}" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push "${IMAGE}"

  helm-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint apps/demo-api/chart -f environments/dev/demo-api/values.yaml

      - name: Helm template
        run: helm template demo-api apps/demo-api/chart -f environments/dev/demo-api/values.yaml > rendered.yaml